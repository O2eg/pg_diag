/*
 * pgc-theme.css — theme tokens for the pg-configurator web page.
 *
 * A verbatim copy of css/pgplan-theme.css from pg-explain-viewer
 * (github.com/O2eg/pg_explain_viewer, commit fd8ed5f4dc79), which is in turn
 * the pg_diag report theme. The variable names are kept as `--pv-*` on
 * purpose: renaming them would create a second name for one palette and
 * guarantee the two products drift apart, and pg_diag hosts both.
 *
 * Only the additions at the end of each scheme block are local to this
 * project — the form controls the viewer has no need for. Everything above
 * them is upstream and should be re-copied rather than edited.
 *
 * Two schemes, activated exactly as in the viewer:
 *   light  — default for the bare .pv container
 *   dark   — data-pv-theme="dark" on .pv or any ancestor
 */

/*
 * pgplan-theme.css — theme tokens for the pg-explain-viewer library.
 *
 * Every color and font used by the visualization is declared here as a
 * CSS custom property on the .pv container. To restyle (or to blend the
 * widget into a host application), override these variables —
 * pgplan.css contains no literal colors or font names.
 *
 * The palette, fonts and sizing follow the pg_diag report theme
 * (render/templates/report.html): the same purple/gold surfaces in both
 * schemes, system-ui + ui-monospace stacks, 13–14px base sizes.
 *
 * Two built-in schemes:
 *   light  — default for the bare .pv container
 *   dark   — activated by data-pv-theme="dark" on .pv or any ancestor
 *            (matches pg_diag's default scheme)
 *
 * Heat-map hues (--pv-hue-*) are read by the renderer at run time, so a
 * theme can also retune the data-driven coloring.
 */

.pv {
  /* fonts (same stacks as the pg_diag report) */
  --pv-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --pv-font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  /* unified type scale — the only three text sizes used anywhere */
  --pv-fs-lg: 15.5px;      /* headings: card titles, relation names   */
  --pv-fs: 14px;           /* base: cells, node text, chips, tabs     */
  --pv-fs-sm: 13px;        /* secondary: column heads, details, badges */
  /* legacy aliases */
  --pv-fs-detail: var(--pv-fs-sm);
  --pv-fs-head: var(--pv-fs-sm);

  /* surfaces & text (pg_diag light) */
  --pv-bg: #ffffff;
  --pv-fg: #2b1d38;
  --pv-fg-muted: #746286;
  --pv-fg-faint: #b0a3c0;
  --pv-border: #dfd2ec;
  --pv-border-strong: #c9b3df;
  --pv-row-hover: #f6effc;
  --pv-row-total-bg: #fffaf0;
  --pv-detail-bg: #f4edfb;
  --pv-thead-bg: #efe2f8;

  /* accent (pg_diag gold) */
  --pv-accent: #f4cf6a;
  --pv-accent-soft: #fff0ba;
  --pv-accent-fg: #62490f;
  --pv-accent-contrast: #2a1738;

  /* charts: fixed phases keep fixed hues between plans; the categorical ramp
     is colour-blind safe (Okabe-Ito) and never the only identifier — every
     mark carries a text label too */
  --pv-cat-1: #0072b2;
  --pv-cat-2: #d55e00;
  --pv-cat-3: #009e73;
  --pv-cat-4: #cc79a7;
  --pv-cat-5: #56638a;
  --pv-cat-6: #b8860b;
  --pv-cat-other: #9a8fa8;

  /* summary chips — a readout surface, deliberately a step away from the
     transparent tab pills so the two rows never read as one control set */
  --pv-chip-bg: #e9dcf6;
  --pv-chip-border: #d3c2e6;
  --pv-chip-label: #746286;
  --pv-chip-value: #2b1d38;

  /* code panels (SQL blocks) */
  --pv-code-bg: #f6f8fa;
  --pv-code-fg: #24292f;

  /* node text accents (unified palette of the visualization) */
  --pv-c-type: #c2410c;      /* operation type      */
  --pv-c-index: #2e7d4f;     /* index name          */
  --pv-c-rel: #3b5fa0;       /* relation name       */
  --pv-c-alias: #a352a3;     /* alias               */
  --pv-c-num: #4f7ca8;       /* numbers in details  */
  --pv-c-num-cond: #cf4a44;  /* numbers in filters / conds */
  --pv-c-str: #3e7e3e;       /* string literals     */
  --pv-c-dvdr: #beb2cc;      /* digit-group divider */

  /* tree guides (pg_diag indent-line colors) */
  --pv-guide: #e7ddf1;
  --pv-guide-hl: #c9a04e;    /* direct children on hover   */
  --pv-guide-hl2: #e6d3a0;   /* deeper subtree on hover    */

  /* advisor severity badges */
  --pv-sev-crit: #c23a3a;    /* missing / inefficient index, redundant work */
  --pv-sev-warn: #d97e2a;    /* overload, heavy CTE                          */
  --pv-sev-io:   #4c6a8f;    /* bloat, write-on-read                         */
  --pv-sev-mem:  #8a4fae;    /* work_mem spills, planning overhead           */
  --pv-sev-idx:  #b03ab0;    /* bitmap / composite index advice              */
  --pv-sev-info: #2e8bb8;    /* statistics, workers, duplicated subtrees     */
  --pv-sev-hint: #3d9a52;    /* ordering / limit hints                       */
  --pv-badge-fg: #ffffff;

  /* diagram */
  --pv-dg-edge: #d5c8e2;
  --pv-dg-node-bg: #f4edfb;
  --pv-dg-node-border: #c9b3df;

  /* pulse highlight on navigation (accent gold) */
  --pv-pulse: rgba(244, 207, 106, 0.45);

  /* SQL syntax highlighting (highlight.js token classes) */
  --pv-hl-keyword: #cf222e;
  --pv-hl-func: #6639ba;
  --pv-hl-string: #0a3069;
  --pv-hl-number: #0550ae;
  --pv-hl-operator: #953800;
  --pv-hl-type: #953800;
  --pv-hl-comment: #6e7781;

  /* heat map: hues (degrees) + saturation/lightness (unitless numbers) */
  --pv-hue-hot: 0;           /* highest metric value  (red)    */
  --pv-hue-warm: 60;         /* low end of hot scale  (yellow) */
  --pv-hue-incl: 120;        /* inclusive time        (green)  */
  --pv-hue-loops: 240;       /* loop counter          (blue)   */
  --pv-hue-over: 0;          /* rows overestimated    (red)    */
  --pv-hue-under: 240;       /* rows underestimated   (blue)   */
  --pv-hue-buf-hit: 120;
  --pv-hue-buf-read: 0;
  --pv-hue-buf-dirtied: 300;
  --pv-hue-buf-written: 240;
  --pv-hue-sat: 80;
  --pv-hue-light: 42;

  color: var(--pv-fg);
  background: var(--pv-bg);
  font-family: var(--pv-font-ui);

  /* form controls (local to pg-configurator; not in the upstream theme) */
  --pv-input-bg: #ffffff;
  --pv-input-fg: var(--pv-fg);
  --pv-input-border: #cdbcdf;
  --pv-input-border-hover: #b79ed0;
  --pv-input-focus: #8b5fbf;
  --pv-input-disabled-bg: #f4eff9;
  --pv-input-placeholder: #a394b5;
  --pv-ok: #2e7d4f;
  --pv-bad: #c23a3a;
  --pv-bad-bg: #fdeeee;
  --pv-group-bg: #faf6fe;

}

  --pv-hue-sat: 65;
  --pv-hue-light: 55;

  /* form controls (local to pg-configurator; not in the upstream theme) */
  --pv-input-bg: #1d1626;
  --pv-input-fg: var(--pv-fg);
  --pv-input-border: #55416a;
  --pv-input-border-hover: #7a5f96;
  --pv-input-focus: #b98ce0;
  --pv-input-disabled-bg: #2a2033;
  --pv-input-placeholder: #7d6a93;
  --pv-ok: #6dc48d;
  --pv-bad: #ef8a8a;
  --pv-bad-bg: #3a2028;
  --pv-group-bg: #2a2033;

}

/* ==========================================================================
 * Page shell.
 *
 * The upstream theme above styles a widget that lives inside a host page. A
 * standalone page needs one more layer, and pg-explain-viewer keeps it in its
 * own template: a page ground distinct from the panel surface, control
 * surfaces, and `color-scheme` so native selects, checkboxes and scrollbars
 * follow the theme instead of staying light inside a dark page.
 *
 * The values are the viewer's chrome palette verbatim. Unlike the viewer, the
 * scheme is always stamped on the root element, so there is no flash of the
 * wrong theme before the script runs.
 * ========================================================================== */

[data-pv-theme='dark'] {
  color-scheme: dark;
  --vw-bg: #17111f;
  --vw-panel: #241a2d;
  --vw-input-bg: #1d1526;
  --vw-fg: #f8f0ff;
  --vw-muted: #d8c8e8;
  --vw-border: #463456;
  --vw-border-strong: #725a87;
  --vw-accent: #f3d46b;
  --vw-accent-contrast: #24152f;
  --vw-button-bg: #2b2035;
  --vw-button-hover: #392847;
  --vw-err-bg: #3f1717;
  --vw-err-fg: #ffb4b4;
  --vw-tip-shadow: rgba(0, 0, 0, 0.45);
  --vw-severity-warning: #f0a5a5;
  --vw-severity-assumption: #f3d46b;
  --vw-severity-info: #725a87;
}

[data-pv-theme='light'] {
  color-scheme: light;
  --vw-bg: #fbf7ff;
  --vw-panel: #ffffff;
  --vw-input-bg: #fffdf7;
  --vw-fg: #2b1d38;
  --vw-muted: #746286;
  --vw-border: #dfd2ec;
  --vw-border-strong: #c9b3df;
  --vw-accent: #f4cf6a;
  --vw-accent-contrast: #2a1738;
  --vw-button-bg: #fffaf0;
  --vw-button-hover: #f6ecff;
  --vw-err-bg: #fee2e2;
  --vw-err-fg: #991b1b;
  --vw-tip-shadow: rgba(90, 60, 120, 0.22);
  --vw-severity-warning: #b91c1c;
  --vw-severity-assumption: #b08415;
  --vw-severity-info: #c9b3df;
}

<style>
/*
 * pgc.css — structural styles for the pg-configurator web page.
 *
 * Spacing comes in two families, and they are kept apart on purpose:
 *
 *   Layout — the space between blocks — is on a 4px scale, written as
 *   `--pc-sp-*`. Anything separating one thing from another uses it, so the
 *   page has one rhythm rather than a value chosen per component.
 *
 *   Control geometry — the padding inside a tab, a button, the theme switch,
 *   a table cell — is copied verbatim from pg-explain-viewer and stays as
 *   literal pixels. Rounding it onto the scale would break the family
 *   resemblance for no gain, so a literal here means "inherited, do not
 *   tidy".
 *
 * Contains no literal colour, font name or text size: everything comes from
 * the custom properties in pgc-theme.css, the same contract
 * pg-explain-viewer keeps between pgplan.css and pgplan-theme.css. A host
 * application re-skins the page by overriding the variables alone.
 *
 * The control language is the viewer's, not a second one invented here:
 * pill tabs and chips with a monospace value, a bordered table wrapper with
 * borderless rows, slim themed scrollbars, and the report's switch control.
 */

:root {
  --pc-sp-1: 4px;
  --pc-sp-2: 8px;
  --pc-sp-3: 12px;
  --pc-sp-4: 16px;
  --pc-sp-5: 20px;
  --pc-sp-6: 24px;
  --pc-sp-12: 48px;
}

* {
  box-sizing: border-box;
}

/* Slim themed scrollbars everywhere — page, tables, code panes. */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--vw-border-strong) transparent;
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--vw-border-strong);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

*::-webkit-scrollbar-thumb:hover {
  background: var(--vw-accent);
  background-clip: padding-box;
}

*::-webkit-scrollbar-corner {
  background: transparent;
}

body {
  margin: 0;
  /* The page ground is a step away from the panel surface, so cards and
     tables read as sitting on it rather than merging with it. */
  background: var(--vw-bg);
  color: var(--vw-fg);
  font-family: var(--pv-font-ui);
  font-size: var(--pv-fs);
  line-height: 1.45;
}

.pc-wrap {
  max-width: 1700px;
  margin: 0 auto;
  padding: var(--pc-sp-4) var(--pc-sp-6) var(--pc-sp-12);
}

/* ---------------------------------------------------------------- header */

.pc-top {
  display: flex;
  align-items: flex-start;
  gap: var(--pc-sp-4);
  flex-wrap: wrap;
}

.pc-top .spacer {
  flex: 1;
}

.pc-title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}

.pc-title small {
  margin-left: 10px;
  font-size: var(--pv-fs);
  font-weight: 400;
  color: var(--vw-muted);
}

/* Project identity, laid out like the pg_diag report header. */
.pc-ident {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--pc-sp-4);
  margin-top: var(--pc-sp-2);
}

.pc-ident,
.pc-ident a {
  color: var(--vw-muted);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  text-decoration: none;
}

.pc-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.pc-link:hover,
.pc-link:focus-visible {
  color: var(--vw-fg);
  text-decoration: underline;
  outline: none;
}

.pc-link svg {
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Theme switch — the same control as the pg_diag report header. */
.pc-theme-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 9px;
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  background: var(--vw-button-bg);
  color: var(--vw-muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

[data-pc-embedded] .pc-theme-toggle {
  display: none;
}

.pc-theme-toggle input {
  appearance: none;
  position: relative;
  width: 42px;
  height: 22px;
  margin: 0;
  border: 1px solid var(--vw-border-strong);
  border-radius: 999px;
  background: var(--vw-input-bg);
  cursor: pointer;
  transition:
    background 120ms ease,
    border-color 120ms ease;
}

.pc-theme-toggle input::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--vw-muted);
  transition:
    transform 120ms ease,
    background 120ms ease;
}

.pc-theme-toggle input:checked {
  border-color: var(--vw-accent);
  background: var(--vw-accent);
}

.pc-theme-toggle input:checked::before {
  transform: translateX(20px);
  background: var(--vw-accent-contrast);
}

/* -------------------------------------------------------------------- tabs */

/* Tabs on the left, the page-wide buttons on the right, one rule under both.
   The buttons act on the whole page rather than on any one panel, so this is
   where they belong; the tablist stays a tablist and nothing else. */
.pc-tabrow {
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  align-items: center;
  border-bottom: 1px solid var(--pv-border);
  padding-bottom: var(--pc-sp-4);
  /* The rule sits midway between the pills and the panels rather than hugging
     the pills. */
  margin: var(--pc-sp-4) 0;
}

.pc-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  align-items: center;
}

.pc-tab {
  padding: 6px 15px;
  border: 1px solid var(--pv-border);
  border-radius: 999px;
  background: none;
  color: var(--pv-fg-muted);
  font: inherit;
  font-size: var(--pv-fs);
  cursor: pointer;
  user-select: none;
  transition:
    background 120ms ease,
    color 120ms ease,
    border-color 120ms ease;
}

.pc-tab:hover {
  color: var(--pv-fg);
  background: var(--pv-row-hover);
  border-color: var(--pv-border-strong);
}

/* The panes that carry findings rather than views of the configuration. Same
   specificity as .pc-tab, so these must come after it to win. */
.pc-tab-finding,
.pc-tab-finding:hover {
  border-color: var(--pv-accent);
}

.pc-tab[aria-selected='true'] {
  color: var(--pv-accent-contrast);
  background: var(--pv-accent);
  border-color: var(--pv-accent);
  font-weight: 600;
}

.pc-tab .pc-count,
.pc-output-tab .pc-count {
  margin-left: var(--pc-sp-2);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  color: var(--pv-fg-faint);
}

.pc-tab[aria-selected='true'] .pc-count {
  color: var(--pv-accent-contrast);
  opacity: 0.75;
}

/* A count with no number still occupies its left margin, which pushes the label
   off centre by the width of that gap. Collapsing the empty element is what
   makes a tab without a number look centred beside one that has it. */
.pc-count:empty {
  display: none;
}

.pc-panel[hidden] {
  display: none;
}

/* ------------------------------------------------------------------ form */

/* One group at a time, chosen from a second row of tabs. The whole form at once
   was six boxes of very different heights and a lot of scrolling. */
.pc-subtabs,
.pc-output-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  margin-bottom: var(--pc-sp-3);
}

.pc-subtab,
.pc-output-tab {
  padding: 5px 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: none;
  color: var(--pv-fg-muted);
  font: inherit;
  font-size: var(--pv-fs-sm);
  cursor: pointer;
  user-select: none;
  transition:
    background 120ms ease,
    color 120ms ease,
    border-color 120ms ease;
}

.pc-subtab:hover,
.pc-output-tab:hover {
  color: var(--pv-fg);
  background: var(--pv-row-hover);
}

/* The selected one takes the panel's own background, so the tab reads as the
   front edge of the box below it rather than a second row of pills. */
.pc-subtab[aria-selected='true'],
.pc-output-tab[aria-selected='true'] {
  color: var(--pv-fg);
  border-color: var(--pv-border);
  background: var(--vw-panel);
  font-weight: 600;
}

.pc-groupbox {
  border: 1px solid var(--pv-border);
  border-radius: 12px;
  background: var(--vw-panel);
  padding: var(--pc-sp-4);
}

.pc-groupbox[hidden] {
  display: none;
}

.pc-output-panel[hidden] {
  display: none;
}

/* A real grid gives both halves shared rows. CSS multi-column flow looked
   compact, but every column laid out its rows independently: one wrapped label
   shifted only the controls below it and the two halves no longer lined up.
   Two bounded columns keep related min/max and budget pairs on one baseline;
   the cap prevents their controls becoming needlessly wide on large screens. */
.pc-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--pc-sp-6);
  row-gap: 0;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}

/* The deployable outputs sit in the same panel as the form that produces
   them; a rule and local tabs keep them separate from the input groups. */
.pc-section {
  margin-top: var(--pc-sp-6);
  padding-top: var(--pc-sp-6);
  border-top: 1px solid var(--pv-border);
}

/* Every field uses the same label track and lets the value consume the rest of
   its grid column. The longest option names fit on one line at desktop widths,
   while ranges, selects and text inputs all begin on the same vertical guide. */
.pc-field {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  width: 100%;
  min-width: 0;
  align-items: center;
  align-self: start;
  gap: var(--pc-sp-3);
  padding: var(--pc-sp-1) 0;
}

/* Names sit against their values rather than against the left edge, so the
   distance from a name to the thing it names is one gap for every field
   instead of however much of the track that name happened not to use. */
.pc-field > label {
  text-align: right;
  font-size: var(--pv-fs-sm);
  color: var(--vw-muted);
  white-space: nowrap;
}

/* Direct children only: a descendant selector here would also style the
   checkboxes inside the extension inventory, stretching them to full width. */
.pc-field > input,
.pc-field > select {
  width: 100%;
  min-width: 0;
  padding: 5px 10px;
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  background: var(--vw-input-bg);
  color: var(--vw-fg);
  font: inherit;
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  line-height: normal;
}

.pc-field > select {
  font-family: var(--pv-font-ui);
}

.pc-field > input:hover,
.pc-field > select:hover {
  border-color: var(--vw-border-strong);
}

.pc-field > input:focus,
.pc-field > select:focus {
  outline: none;
  border-color: var(--vw-accent);
}

.pc-field > input:disabled,
.pc-field > select:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.pc-field > input::placeholder {
  color: var(--pv-fg-faint);
}

.pc-field.pc-invalid > input,
.pc-field.pc-invalid > select {
  border-color: var(--vw-err-fg);
}

/* A slider needs more of the row than a text box does. */
.pc-control {
  display: flex;
  align-items: center;
  gap: var(--pc-sp-2);
  width: 100%;
  min-width: 0;
}

.pc-range {
  flex: 1;
  min-width: 0;
  height: 20px;
  margin: 0;
  accent-color: var(--vw-accent);
  cursor: pointer;
}

.pc-readout {
  width: calc(8ch + 22px);
  flex: 0 0 auto;
  padding: 5px 10px;
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  background: var(--vw-input-bg);
  color: var(--vw-fg);
  font: inherit;
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  text-align: right;
  line-height: normal;
}

.pc-readout:hover {
  border-color: var(--vw-border-strong);
}

.pc-readout:focus {
  outline: none;
  border-color: var(--vw-accent);
}

.pc-readout::placeholder {
  color: var(--pv-fg-faint);
}

/* Profile names are the field's value, so the list starts on the same guide as
   every other value rather than at the field's outer edge. */
.pc-choices {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  padding-top: var(--pc-sp-1);
}

.pc-choices label {
  display: inline-flex;
  align-items: center;
  gap: var(--pc-sp-1);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  color: var(--vw-muted);
  cursor: pointer;
}

.pc-choices input {
  accent-color: var(--vw-accent);
  cursor: pointer;
}

.pc-choices .pc-choice-off {
  opacity: 0.5;
  cursor: not-allowed;
}

.pc-choices .pc-choice-off input {
  cursor: not-allowed;
}

/* Two rows of controls with the same layout and opposite neighbours: the form
   footer follows its content, the output toolbar precedes it. */
.pc-actions,
.pc-toolbar {
  display: flex;
  gap: var(--pc-sp-2);
  align-items: center;
  flex-wrap: wrap;
}

.pc-actions {
  margin-left: auto;
}

.pc-toolbar {
  margin-bottom: var(--pc-sp-4);
}

.pc-btn {
  font: inherit;
  color: var(--vw-fg);
  background: var(--vw-button-bg);
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  padding: 6px 13px;
  line-height: normal;
  margin: 0;
  cursor: pointer;
}

.pc-btn:hover {
  background: var(--vw-button-hover);
  border-color: var(--vw-border-strong);
}

.pc-btn.primary {
  background: var(--vw-accent);
  color: var(--vw-accent-contrast);
  border-color: var(--vw-accent);
  font-weight: 600;
}

.pc-btn.primary:hover {
  filter: brightness(1.06);
}

.pc-hint {
  color: var(--vw-muted);
  font-size: var(--pv-fs);
}

.pc-hint code {
  font-family: var(--pv-font-mono);
  border: 1px solid var(--vw-border);
  border-radius: 4px;
  padding: 0 4px;
}

/* ---------------------------------------------------------------- output */

.pc-error {
  /* The message sits between the fields and the settings, so it needs air on
     both sides. `.pc-form` ends flush with its last group, contributing no
     bottom margin of its own, and the gap below collapses to the section's
     own top margin — so both sides are set to the same step here. */
  margin: var(--pc-sp-6) 0 var(--pc-sp-4);
  padding: 10px 14px;
  border: 1px solid var(--vw-border-strong);
  border-radius: 10px;
  color: var(--vw-err-fg);
  background: var(--vw-err-bg);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  line-height: 1.5;
  white-space: pre-wrap;
  /* One line of text plus the padding and border above and below it. The slot
     is held open whether or not there is a message, so the panels below do not
     move as input goes in and out of range. Box-sizing is border-box here. */
  min-height: calc(1.5em + 22px);
}

.pc-error-quiet {
  visibility: hidden;
}

.pc-code {
  margin: 0;
  padding: var(--pc-sp-4);
  border: 1px solid var(--pv-border);
  border-radius: 12px;
  background: var(--vw-panel);
  color: var(--pv-fg);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre;
}

.pc-tablewrap {
  overflow-x: auto;
  border: 1px solid var(--pv-border);
  border-radius: 10px;
}

.pc-table {
  border-collapse: collapse;
  width: 100%;
  background: var(--pv-bg);
}

.pc-table-intro {
  margin-bottom: var(--pc-sp-3);
}

/* Calculation has one descriptive column and two numeric columns. Fixed
   tracks keep Value away from Size, and matching right edges put each heading
   directly above the numbers it names. */
.pc-calculation-table {
  table-layout: fixed;
  min-width: 640px;
}

.pc-calculation-table th:first-child {
  width: 60%;
}

.pc-calculation-table th:nth-child(2),
.pc-calculation-table th:nth-child(3) {
  width: 20%;
  text-align: right;
}

.pc-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--pv-thead-bg);
  color: var(--pv-fg-muted);
  font-family: var(--pv-font-ui);
  font-size: var(--pv-fs-head);
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  padding: 8px 10px 7px;
  border-bottom: 1px solid var(--pv-border);
}

.pc-table td {
  padding: 5px 10px;
  vertical-align: top;
  border: none;
  font-family: var(--pv-font-mono);
  color: var(--pv-fg);
}

.pc-table tbody tr:hover {
  background: var(--pv-row-hover);
}

.pc-num {
  text-align: right;
  white-space: nowrap;
}

.pc-muted {
  color: var(--pv-fg-muted);
}

.pc-faint {
  color: var(--pv-fg-faint);
}

/* Apply-mode markers. Colour is never the only signal: every cell carries the
   mode as text as well. */
.pc-apply {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--pv-border-strong);
  font-family: var(--pv-font-ui);
  font-size: var(--pv-fs-sm);
  white-space: nowrap;
}

.pc-apply-restart {
  border-color: var(--pv-sev-crit);
  color: var(--pv-sev-crit);
}

.pc-apply-reload_and_reconnect {
  border-color: var(--pv-sev-warn);
  color: var(--pv-sev-warn);
}

.pc-apply-reload {
  border-color: var(--pv-sev-hint);
  color: var(--pv-sev-hint);
}

.pc-source-base {
  color: var(--pv-fg-muted);
}

.pc-source-profile {
  color: var(--pv-c-alias);
}

.pc-filter {
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  align-items: center;
  margin-bottom: var(--pc-sp-4);
}

.pc-filter input {
  min-width: 260px;
  padding: 5px 10px;
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  background: var(--vw-input-bg);
  color: var(--vw-fg);
  font: inherit;
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
}

.pc-filter input:focus {
  outline: none;
  border-color: var(--vw-accent);
}

/* The Diff tab's paste box: the text control geometry, tall and resizable. */
.pc-diff-input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  min-height: 160px;
  margin-bottom: var(--pc-sp-4);
  padding: var(--pc-sp-2) var(--pc-sp-3);
  border: 1px solid var(--vw-border);
  border-radius: 10px;
  background: var(--vw-input-bg);
  color: var(--vw-fg);
  font: inherit;
  font-family: var(--pv-font-mono);
  font-size: var(--pv-fs-sm);
  line-height: 1.45;
  resize: vertical;
}

.pc-diff-input:hover {
  border-color: var(--vw-border-strong);
}

.pc-diff-input:focus {
  outline: none;
  border-color: var(--vw-accent);
}

.pc-diff-summary {
  margin-bottom: var(--pc-sp-3);
}

.pc-diff-yours {
  color: var(--vw-severity-warning);
}

.pc-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.pc-list li {
  padding: 10px 14px;
  border: 1px solid var(--pv-border);
  border-radius: 10px;
  background: var(--vw-panel);
  margin-bottom: var(--pc-sp-2);
  font-size: var(--pv-fs-sm);
  color: var(--pv-fg);
}

/* The page draws its own tooltip: the native one is unstyled, slow to appear
   and truncates. Geometry and timing follow pg_explain_viewer. */
.pc-tip {
  position: fixed;
  z-index: 1000;
  max-width: 520px;
  padding: 9px 12px;
  border: 1px solid var(--vw-border-strong);
  border-radius: 8px;
  background: var(--vw-panel);
  color: var(--vw-fg);
  font-size: var(--pv-fs-sm);
  line-height: 1.5;
  white-space: pre-line;
  box-shadow: 0 6px 22px var(--vw-tip-shadow);
  pointer-events: none;
}

.pc-tip[hidden] {
  display: none;
}

.pc-empty {
  color: var(--pv-fg-muted);
  padding: 18px 8px;
  text-align: center;
  font-size: var(--pv-fs-sm);
}

/* Keep the paired desktop layout while both controls still have useful room.
   Once it no longer fits, put labels above full-width values immediately.
   A centred one-column form with a 210px side-label track leaves a large
   empty area on the left and makes the form look shifted to the right. */
@media (min-width: 821px) and (max-width: 1000px) {
  /* The profile names need more room than one compact value track. A full
     outer row preserves the shared label/value guides without clipping. */
  .pc-field-profiles {
    grid-column: 1 / -1;
  }
}

@media (max-width: 820px) {
  .pc-fields {
    grid-template-columns: minmax(0, 1fr);
    max-width: none;
  }

  .pc-field {
    grid-template-columns: 1fr;
    gap: var(--pc-sp-2);
  }

  .pc-field > label {
    text-align: left;
    white-space: normal;
  }

  .pc-field-profiles > .pc-choices {
    grid-column: 1;
  }
}

@media (max-width: 700px) {
  .pc-wrap {
    padding: var(--pc-sp-4) var(--pc-sp-4) var(--pc-sp-12);
  }
}

/* An advisory is a heading line naming the setting it is about and the stable
   code a report can be keyed on, over the sentence that explains it. The left
   edge carries the severity so the three groups stay apart when scrolled. */
.pc-advisory-heading {
  margin: var(--pc-sp-5) 0 var(--pc-sp-3);
  font-size: var(--pv-fs-sm);
  color: var(--vw-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.pc-advisory-heading:first-child {
  margin-top: 0;
}

.pc-list .pc-advisory {
  border-left-width: 3px;
  border-left-style: solid;
}

.pc-list .pc-advisory-warning {
  border-left-color: var(--vw-severity-warning);
}

.pc-list .pc-advisory-assumption {
  border-left-color: var(--vw-severity-assumption);
}

.pc-list .pc-advisory-info {
  border-left-color: var(--vw-severity-info);
}

.pc-advisory-head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--pc-sp-2);
  align-items: baseline;
  margin-bottom: var(--pc-sp-1);
}

.pc-advisory-setting {
  font-family: var(--pv-font-mono);
  color: var(--pv-fg);
}

.pc-advisory-code {
  font-family: var(--pv-font-mono);
  color: var(--vw-muted);
}

</style>
</head>

// --- src/units.js ------------------------------------------------
/**
 * Python-compatible numbers, text and size units.
 *
 * The reference implementation is Python, and two of its behaviours reach the
 * user directly:
 *
 *   - integers and floats are different types. `str(4.0)` is `"4.0"` while
 *     `str(4)` is `"4"`, and a generated `postgresql.conf` prints exactly that
 *     string. `--disk-score 0` produces `random_page_cost = 4.0`; a port that
 *     used a single numeric type would print `4`.
 *   - `round(x, n)` rounds half to even on the binary value, while both
 *     `Math.round` and `toFixed` round halves away from zero. `--db-cpu 0.0625`
 *     reaches that difference through `round(value, 3)`.
 *
 * So numbers crossing the rule evaluator carry their Python type, and the
 * helpers here reproduce the arithmetic and formatting that go with it. Values
 * that never reach a rule or a printed setting stay ordinary JavaScript
 * numbers.
 */

/**
 * Python exception identities.
 *
 * `make_conf` catches `(RuleEvaluationError, TypeError, ValueError,
 * ZeroDivisionError)` around every rule, so which one is raised is control
 * flow, not just a message.
 */
class PyValueError extends Error {
  constructor(message) {
    super(message);
    this.name = 'ValueError';
  }
}

class PyTypeError extends Error {
  constructor(message) {
    super(message);
    this.name = 'TypeError';
  }
}

class PyZeroDivisionError extends Error {
  constructor(message) {
    super(message);
    this.name = 'ZeroDivisionError';
  }
}

const INT = 'int';
const FLOAT = 'float';

/** A Python number: a value plus the type Python would have given it. */
class PyNumber {
  constructor(value, kind) {
    if (typeof value !== 'number' || !Number.isFinite(value)) {
      throw new TypeError(`PyNumber requires a finite number, got ${value}`);
    }
    if (kind !== INT && kind !== FLOAT) {
      throw new TypeError(`Unknown numeric kind: ${kind}`);
    }
    if (kind === INT && !Number.isInteger(value)) {
      throw new TypeError(`Integer value is not integral: ${value}`);
    }
    // Python integers have no negative zero, so `int(-0.5)` is `0` while
    // `Math.trunc(-0.5)` is `-0`. Floats keep theirs: `-0.0` is a real float.
    this.value = kind === INT && Object.is(value, -0) ? 0 : value;
    this.kind = kind;
    Object.freeze(this);
  }

  get isInt() {
    return this.kind === INT;
  }
}

/** Tag a value as a Python int, truncating toward zero the way `int()` does. */
function pyInt(value) {
  return new PyNumber(Math.trunc(numberOf(value)), INT);
}

/** Tag a value as a Python float. */
function pyFloat(value) {
  return new PyNumber(numberOf(value), FLOAT);
}

/** The plain numeric value of a number, boolean or PyNumber. */
function numberOf(value) {
  if (value instanceof PyNumber) return value.value;
  if (typeof value === 'boolean') return value ? 1 : 0;
  if (typeof value === 'number') return value;
  throw new TypeError(`Not a number: ${describe(value)}`);
}

/** True when a value behaves as a Python integer (bool is a subclass of int). */
function isIntegral(value) {
  if (value instanceof PyNumber) return value.isInt;
  if (typeof value === 'boolean') return true;
  return false;
}

function describe(value) {
  if (value === null || value === undefined) return 'None';
  if (typeof value === 'string') return JSON.stringify(value);
  return String(value);
}

// --------------------------------------------------------------------------
// arithmetic
// --------------------------------------------------------------------------

function combine(left, right, operation) {
  const result = operation(numberOf(left), numberOf(right));
  const kind = isIntegral(left) && isIntegral(right) ? INT : FLOAT;
  return new PyNumber(result, kind);
}

function add(left, right) {
  if (typeof left === 'string' || typeof right === 'string') {
    if (typeof left !== 'string' || typeof right !== 'string') {
      throw new TypeError('Cannot concatenate a string with a non-string');
    }
    return left + right;
  }
  return combine(left, right, (a, b) => a + b);
}

function subtract(left, right) {
  return combine(left, right, (a, b) => a - b);
}

function multiply(left, right) {
  return combine(left, right, (a, b) => a * b);
}

/** Python's `/` is true division: the result is always a float. */
function divide(left, right) {
  const divisor = numberOf(right);
  if (divisor === 0) {
    throw new PyZeroDivisionError('division by zero');
  }
  return pyFloat(numberOf(left) / divisor);
}

// --------------------------------------------------------------------------
// builtins reachable from a rule
// --------------------------------------------------------------------------

/** Python truthiness: 0, 0.0, "", [], (), None and False are false. */
function isTruthy(value) {
  if (value === null || value === undefined) return false;
  if (typeof value === 'boolean') return value;
  if (value instanceof PyNumber) return value.value !== 0;
  if (typeof value === 'number') return value !== 0;
  if (typeof value === 'string') return value.length > 0;
  if (Array.isArray(value)) return value.length > 0;
  return true;
}

/** Python's `int()`: truncate toward zero, parse a string, keep bools as 0/1. */
function toInt(value) {
  if (typeof value === 'string') {
    const text = value.trim();
    if (!/^[+-]?\d+$/.test(text)) {
      throw new PyValueError(`invalid literal for int() with base 10: '${value}'`);
    }
    return new PyNumber(Number(text), INT);
  }
  return pyInt(numberOf(value));
}

/** Python's `float()`. */
function toFloat(value) {
  if (typeof value === 'string') {
    const parsed = Number(value.trim());
    if (Number.isNaN(parsed)) {
      throw new PyValueError(`could not convert string to float: '${value}'`);
    }
    return pyFloat(parsed);
  }
  return pyFloat(numberOf(value));
}

/**
 * Python's `round`.
 *
 * With one argument it returns an int; with two it keeps the argument's type.
 * Rounding is half to even on the exact binary value, which is why this works
 * on the decomposed double through BigInt rather than through `toFixed`: the
 * two disagree on every exact tie, and `round(0.0625, 3)` is one.
 */
function pyRound(value, digits) {
  const kind = isIntegral(value) ? INT : FLOAT;
  const x = numberOf(value);
  if (digits === undefined || digits === null) {
    return new PyNumber(roundHalfEvenToInteger(x), INT);
  }
  const places = Math.trunc(numberOf(digits));
  if (kind === INT && places >= 0) {
    return new PyNumber(x, INT);
  }
  return new PyNumber(roundToPlaces(x, places), kind);
}

function roundHalfEvenToInteger(x) {
  const floor = Math.floor(x);
  const rest = x - floor;
  if (rest > 0.5) return floor + 1;
  if (rest < 0.5) return floor;
  return floor % 2 === 0 ? floor : floor + 1;
}

/** Exact `mantissa * 2 ** exponent` decomposition of a non-negative double. */
function decompose(x) {
  const buffer = new DataView(new ArrayBuffer(8));
  buffer.setFloat64(0, x);
  const high = buffer.getUint32(0);
  const low = buffer.getUint32(4);
  const rawExponent = (high >>> 20) & 0x7ff;
  const rawMantissa = (BigInt(high & 0xfffff) << 32n) | BigInt(low);
  if (rawExponent === 0) {
    return { mantissa: rawMantissa, exponent: -1074 };
  }
  return { mantissa: rawMantissa | (1n << 52n), exponent: rawExponent - 1075 };
}

function roundToPlaces(x, places) {
  if (x === 0) return x;
  const negative = x < 0;
  const { mantissa, exponent } = decompose(Math.abs(x));
  // |x| = mantissa * 2**exponent; we want round_half_even(|x| * 10**places).
  let numerator = mantissa;
  let denominator = 1n;
  if (exponent >= 0) {
    numerator *= 1n << BigInt(exponent);
  } else {
    denominator = 1n << BigInt(-exponent);
  }
  if (places >= 0) {
    numerator *= 10n ** BigInt(places);
  } else {
    denominator *= 10n ** BigInt(-places);
  }

  let quotient = numerator / denominator;
  const remainder = numerator % denominator;
  const twice = remainder * 2n;
  if (twice > denominator || (twice === denominator && quotient % 2n === 1n)) {
    quotient += 1n;
  }

  const magnitude = places >= 0 ? Number(quotient) / 10 ** places : Number(quotient) * 10 ** -places;
  return negative ? -magnitude : magnitude;
}

/**
 * Python's `max`: the first maximal operand, returned as-is.
 *
 * The identity matters, not only the magnitude: `max(0.0, 0)` is the float and
 * `max(0, 0.0)` is the int, and the difference propagates into whether a
 * printed setting reads `4` or `4.0`.
 */
function pyMax(...values) {
  if (values.length === 0) {
    throw new PyValueError('max() arg is an empty sequence');
  }
  let best = values[0];
  for (const value of values.slice(1)) {
    if (numberOf(value) > numberOf(best)) best = value;
  }
  return best;
}

/** Python's `min`: the first minimal operand, returned as-is. */
function pyMin(...values) {
  if (values.length === 0) {
    throw new PyValueError('min() arg is an empty sequence');
  }
  let best = values[0];
  for (const value of values.slice(1)) {
    if (numberOf(value) < numberOf(best)) best = value;
  }
  return best;
}

/** Python's `math.ceil` and `math.floor`, which return ints. */
function pyCeil(value) {
  return new PyNumber(Math.ceil(numberOf(value)), INT);
}

function pyFloor(value) {
  return new PyNumber(Math.floor(numberOf(value)), INT);
}

// --------------------------------------------------------------------------
// text
// --------------------------------------------------------------------------

/**
 * Python's `str()` for the values a rule can produce.
 *
 * Floats follow Python's repr: an integral float keeps its `.0`, the switch to
 * exponent notation happens at 1e16 and below 1e-4, and the exponent is signed
 * and at least two digits. JavaScript switches at 1e21 and 1e-7 and writes
 * `1e-7`, so `String()` cannot be used directly for a printed setting value.
 */
function pyStr(value) {
  if (value === null || value === undefined) return 'None';
  if (typeof value === 'boolean') return value ? 'True' : 'False';
  if (typeof value === 'string') return value;
  if (Array.isArray(value)) return `[${value.map(pyRepr).join(', ')}]`;
  if (value instanceof PyNumber) {
    return value.isInt ? String(value.value) : pyFloatRepr(value.value);
  }
  if (typeof value === 'number') {
    return Number.isInteger(value) ? String(value) : pyFloatRepr(value);
  }
  if (value && typeof value === 'object' && value.__enum__) {
    // BasicEnum.__str__ returns the member value.
    return String(value.value);
  }
  throw new TypeError(`Cannot render ${describe(value)} as Python text`);
}

function pyRepr(value) {
  return typeof value === 'string' ? `'${value}'` : pyStr(value);
}

function pyFloatRepr(x) {
  if (Number.isNaN(x)) return 'nan';
  if (x === Infinity) return 'inf';
  if (x === -Infinity) return '-inf';

  const negative = x < 0 || Object.is(x, -0);
  // toExponential() without an argument yields the shortest digit string that
  // round-trips, which is what Python's repr is built from as well.
  const [mantissa, rawExponent] = Math.abs(x).toExponential().split('e');
  const exponent = Number(rawExponent);
  const digits = mantissa.replace('.', '');
  const sign = negative ? '-' : '';

  if (exponent < -4 || exponent >= 16) {
    const head = digits.length > 1 ? `${digits[0]}.${digits.slice(1)}` : digits;
    const exponentSign = exponent < 0 ? '-' : '+';
    const magnitude = String(Math.abs(exponent)).padStart(2, '0');
    return `${sign}${head}e${exponentSign}${magnitude}`;
  }
  if (exponent >= 0) {
    const whole = digits.padEnd(exponent + 1, '0').slice(0, exponent + 1);
    const fraction = digits.slice(exponent + 1) || '0';
    return `${sign}${whole}.${fraction}`;
  }
  return `${sign}0.${'0'.repeat(-exponent - 1)}${digits}`;
}

// --------------------------------------------------------------------------
// UnitConverter
// --------------------------------------------------------------------------

const SYS_STD = [
  [1024 ** 4, 'T'],
  [1024 ** 3, 'G'],
  [1024 ** 2, 'M'],
  [1024, 'K'],
  [1, 'B'],
];

const SYS_IEC = [
  [1024 ** 4, 'Ti'],
  [1024 ** 3, 'Gi'],
  [1024 ** 2, 'Mi'],
  [1024, 'Ki'],
  [1, ''],
];

const SYS_ISO = [
  [1000 ** 4, 'T'],
  [1000 ** 3, 'G'],
  [1000 ** 2, 'M'],
  [1000, 'K'],
  [1, 'B'],
];

const SYS_PG = [
  [1024 ** 4, 'TB'],
  [1024 ** 3, 'GB'],
  [1024 ** 2, 'MB'],
  [1024, 'kB'],
  [1, ''],
];

/**
 * `UnitConverter.size_to`.
 *
 * The Python loop keeps the last pair when nothing matches, so an unmatched
 * unit falls through to the smallest one rather than raising.
 */
function sizeTo(bytes, system = SYS_ISO, unit = null) {
  const amount = numberOf(bytes);
  let factor = system[system.length - 1][0];
  let postfix = system[system.length - 1][1];
  for (const [candidateFactor, candidatePostfix] of system) {
    factor = candidateFactor;
    postfix = candidatePostfix;
    if ((unit === null && amount / 10 >= candidateFactor) || unit === candidatePostfix) {
      break;
    }
  }
  return String(Math.trunc(amount / factor)) + postfix;
}

const SIZE_PATTERN = /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))\s*([A-Za-z]*)\s*$/;

/** `UnitConverter.size_from`. */
function sizeFrom(value, system = SYS_ISO) {
  if (typeof value === 'boolean') {
    throw new PyValueError('Boolean values are not valid sizes');
  }
  if (value instanceof PyNumber) {
    return pyInt(value.value);
  }
  if (typeof value === 'number') {
    return pyInt(value);
  }

  const match = SIZE_PATTERN.exec(String(value));
  if (match === null) {
    throw new PyValueError(`Invalid size value: ${value}`);
  }
  const amount = Number(match[1]);
  const unit = match[2];
  for (const [factor, suffix] of system) {

const CPU_PATTERN = /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))\s*(m?)\s*$/i;

/**
 * Evaluator for the exported rule expressions.
 *
 * The expressions are Python source. They are parsed in Python, by the same
 * `ast` module `RuleEvaluator` uses, and shipped as JSON trees by
 * `tools/export_web_data.py`; this module only walks those trees. Nothing here
 * parses Python, so the two implementations cannot disagree about what an
 * expression means — only about arithmetic, which is what the parity tests
 * measure.
 *
 * The node and operator set is exactly the one `RuleEvaluator` supports. The
 * exporter refuses to emit anything else, so an unsupported node reaching this
 * walker is a bug in the export, not user input.
 */


class RuleEvaluationError extends Error {
  constructor(message) {
    super(message);
    this.name = 'RuleEvaluationError';
  }
}

const BINARY_OPERATORS = {
  Add: add,
  Sub: subtract,
  Mult: multiply,
  Div: divide,
};

const COMPARISON_OPERATORS = {
  Eq: (left, right) => pyEquals(left, right),
  NotEq: (left, right) => !pyEquals(left, right),
  Lt: (left, right) => pyOrder(left, right) < 0,
  LtE: (left, right) => pyOrder(left, right) <= 0,
  Gt: (left, right) => pyOrder(left, right) > 0,
  GtE: (left, right) => pyOrder(left, right) >= 0,
  In: (left, right) => pyContains(right, left),
  NotIn: (left, right) => !pyContains(right, left),
};

/** Build a frozen enum namespace whose members are interned singletons. */
function makeEnum(name, members) {
  const namespace = { __enumName__: name };
  // `members` is an ordered list of [name, value] pairs: Python reports enum
  // choices in declaration order, and that order reaches a user in an error
  // message.
  for (const [member, value] of members) {
    namespace[member] = Object.freeze({ __enum__: name, name: member, value });
  }
  return Object.freeze(namespace);
}

function isEnumMember(value) {
  return Boolean(value) && typeof value === 'object' && typeof value.__enum__ === 'string';
}

function pyEquals(left, right) {
  if (isEnumMember(left) || isEnumMember(right)) {
    if (!isEnumMember(left) || !isEnumMember(right)) return false;
    return left.__enum__ === right.__enum__ && left.name === right.name;
  }
  if (typeof left === 'string' || typeof right === 'string') {
    return left === right;
  }
  if (left === null || right === null) {
    return left === right;
  }
  if (Array.isArray(left) || Array.isArray(right)) {
    if (!Array.isArray(left) || !Array.isArray(right)) return false;
    return left.length === right.length && left.every((item, index) => pyEquals(item, right[index]));
  }
  return numberOf(left) === numberOf(right);
}

function pyOrder(left, right) {
  if (typeof left === 'string' && typeof right === 'string') {
    if (left === right) return 0;
    return left < right ? -1 : 1;
  }
  const a = numberOf(left);
  const b = numberOf(right);
  if (a === b) return 0;
  return a < b ? -1 : 1;
}

function pyContains(container, item) {
  if (typeof container === 'string') {
    if (typeof item !== 'string') {
      throw new RuleEvaluationError('Membership on a string requires a string');
    }
    return container.includes(item);
  }
  if (Array.isArray(container)) {
    return container.some((element) => pyEquals(element, item));
  }
  throw new RuleEvaluationError('Membership test on an unsupported container');
}

/**
 * Evaluate a deliberately small, side-effect-free expression subset.
 *
 * `context`, `allowedCallables` and `allowedAttributeRoots` mirror the Python
 * constructor arguments; the permitted sets are exported by the data layer so
 * the port can assert it offers exactly the same surface.
 */
class RuleEvaluator {
  constructor(context, { allowedCallables, allowedAttributeRoots }) {
    this.context = context;
    this.allowedCallables = new Set(allowedCallables);
    this.allowedAttributeRoots = new Set(allowedAttributeRoots);
  }

  evaluate(tree) {
    return this.#node(tree);
  }

  #node(node) {
    switch (node.t) {
      case 'Const':
        return constantValue(node);
      case 'Name': {
        if (!(node.id in this.context)) {
          throw new RuleEvaluationError(`Unknown rule name: ${node.id}`);
        }
        return this.context[node.id];
      }
      case 'List':
      case 'Tuple':
        return node.elements.map((item) => this.#node(item));
      case 'BinOp': {
        const operation = BINARY_OPERATORS[node.op];
        if (operation === undefined) {
          throw new RuleEvaluationError('Unsupported binary operator');
        }
        return operation(this.#node(node.left), this.#node(node.right));
      }
      case 'BoolOp':
        return this.#booleanOperation(node);
      case 'Compare':
        return this.#comparison(node);
      case 'IfExp':
        return this.#node(isTruthy(this.#node(node.test)) ? node.body : node.orelse);
      case 'Attribute': {
        const root = this.#node(node.value);
        if (!this.allowedAttributeRoots.has(root) || node.attr.startsWith('_')) {
          throw new RuleEvaluationError('Attribute access is not allowed');
        }
        if (!(node.attr in root)) {
          throw new RuleEvaluationError(`Unknown rule attribute: ${node.attr}`);
        }
        return root[node.attr];
      }
      case 'Call': {
        const target = this.#node(node.func);
        if (!this.allowedCallables.has(target)) {
          throw new RuleEvaluationError('Function call is not allowed');
        }
        const args = node.args.map((argument) => this.#node(argument));
        for (const keyword of node.keywords) {
          // Keyword arguments are bound by position through the callable's
          // declared parameter names; a hole left in between stays `undefined`
          // so the JavaScript default applies exactly where Python's would.
          const position = (target.pyParams ?? []).indexOf(keyword.name);
          if (position < 0) {
            throw new RuleEvaluationError(
              `${target.pyName ?? 'callable'}() got an unexpected keyword argument '${keyword.name}'`,
            );
          }
          args[position] = this.#node(keyword.value);
        }
        return target(...args);
      }
      case 'Subscript': {
        const value = this.#node(node.value);
        const index = this.#node(node.index);
        if (!isIntegral(index)) {
          throw new RuleEvaluationError('Only integer indexes are allowed');
        }
        return subscript(value, numberOf(index));
      }
      default:
        throw new RuleEvaluationError(`Unsupported rule syntax: ${node.t}`);
    }
  }

  /** Python's `and`/`or` return an operand, not a boolean. */
  #booleanOperation(node) {
    if (node.op === 'And') {
      let result = true;
      for (const value of node.values) {
        result = this.#node(value);
        if (!isTruthy(result)) return result;
      }
      return result;
    }
    if (node.op === 'Or') {
      let result = false;
      for (const value of node.values) {
        result = this.#node(value);
        if (isTruthy(result)) return result;
      }
      return result;
    }
    throw new RuleEvaluationError('Unsupported boolean operator');
  }

  /** Chained comparison, evaluated left to right and short-circuiting. */
  #comparison(node) {
    let left = this.#node(node.left);
    for (let index = 0; index < node.ops.length; index += 1) {
      const operation = COMPARISON_OPERATORS[node.ops[index]];
      if (operation === undefined) {
        throw new RuleEvaluationError('Unsupported comparison operator');
      }
      const right = this.#node(node.comparators[index]);
      if (!operation(left, right)) return false;
      left = right;
    }
    return true;
  }
}

function constantValue(node) {
  switch (node.k) {
    case 'int':
      return new PyNumber(node.v, 'int');
    case 'float':
      return new PyNumber(node.v, 'float');
    case 'bool':
      return node.v;
    case 'str':
      return node.v;
    case 'none':
      return null;
    default:
      throw new RuleEvaluationError(`Unsupported constant kind: ${node.k}`);
  }
}

function subscript(value, index) {
  if (!Array.isArray(value)) {
    throw new RuleEvaluationError('Subscript on an unsupported value');
  }
  const position = index < 0 ? value.length + index : index;
  if (position < 0 || position >= value.length) {
    throw new RuleEvaluationError('list index out of range');
  }
  return value[position];
}

/**
 * The calculation core.
 *
 * At this stage it contains the surface a rule expression can reach: the eight
 * callables and six attribute roots `make_conf` hands to `RuleEvaluator`. The
 * budget calculation itself lands here next.
 *
 * Only five of the callables and one of the roots are referenced by any rule in
 * the current corpus, so the rest cannot be reached by the differential matrix
 * at all. They are ported anyway, and covered by their own unit tests, because
 * a future Python rule activates them without warning.
 */




/** Declare the parameter names a rule may use as keyword arguments. */
function declare(name, params, implementation) {
  implementation.pyName = name;
  implementation.pyParams = params;
  return implementation;
}

/**
 * Build the enum roots from the exported data.
 *
 * The members are interned, so `duty_db == DutyDB.FINANCIAL` compares two
 * references to the same object exactly as Python compares enum identities.
 */
function createEnums(enumData) {
  const enums = {};
  for (const [name, members] of Object.entries(enumData)) {
    enums[name] = makeEnum(name, members);
  }
  return enums;
}

/**
 * The closures `make_conf` defines around its own locals.
 *
 * Python closes over the enclosing scope; the port takes the same values as an
 * explicit environment so the functions can be built — and tested — before the
 * rest of the calculation exists.
 */
function createRuleCallables(environment, enums) {
  const {
    cpu_threads,
    connection_capacity,
    connections_per_cpu,
    max_conns,
    total_ram_in_bytes,
    client_mem_part,
    default_temp_buffers_in_bytes,
    min_work_mem_in_bytes,
    work_mem_concurrency_factor,
    hash_mem_multiplier,
    mebibyte,
    duty_work_mem_cap_bytes,
    disk_scores,
    system_scores,
  } = environment;

  const calc_cpu_scale = declare('calc_cpu_scale', ['v_min', 'v_max'], (v_min, v_max) => {
    if (numberOf(v_min) > numberOf(v_max)) {
      throw new PyValueError('v_min must not be greater than v_max');
    }
    const cpu_ratio = pyMin(pyMax(divide(subtract(cpu_threads, pyInt(1)), pyInt(95)), pyInt(0)), pyInt(1));
    return add(multiply(cpu_ratio, subtract(v_max, v_min)), v_min);
  });

  const calc_connection_scale = declare(
    'calc_connection_scale',
    ['v_min', 'v_max'],
    (v_min, v_max) => {
      if (numberOf(connection_capacity) < numberOf(v_min)) {
        throw new PyValueError(
          `Client memory budget supports ${pyIntText(connection_capacity)} connections, ` +
            `less than the required minimum ${pyIntText(v_min)}`,
        );
      }
      const cpu_target = add(
        v_min,
        multiply(pyMax(pyInt(0), subtract(cpu_threads, pyInt(1))), connections_per_cpu),
      );
      return toInt(pyMin(pyMax(cpu_target, v_min), connection_capacity, v_max));
    },
  );

  const calc_connection_limit = declare(
    'calc_connection_limit',
    ['desired_connections', 'required_minimum'],
    (desired_connections, required_minimum) => {
      if (numberOf(desired_connections) < numberOf(required_minimum)) {
        throw new PyValueError(
          `desired_connections=${pyIntText(desired_connections)} is less than the required ` +
            `minimum ${pyIntText(required_minimum)}`,
        );
      }

        throw new PyValueError(
          `Backend memory reserve supports ${pyIntText(connection_capacity)} connections, ` +
            `less than the required minimum ${pyIntText(required_minimum)}`,
        );

    },
  );

  const calc_client_mem_values = declare(
    'calc_client_mem_values',
    ['connection_count', 'temp_buffers_part'],
    (connection_count, temp_buffers_part = pyFloat(0.1)) => {
      if (numberOf(connection_count) <= 0) {
        throw new PyValueError('connection_count must be greater than 0');
      }
      if (numberOf(temp_buffers_part) <= 0 || numberOf(temp_buffers_part) >= 1) {
        throw new PyValueError('temp_buffers_part must be greater than 0 and less than 1');
      }

      const active_query_sessions = pyMin(
        connection_count,
        pyMax(pyInt(4), multiply(cpu_threads, pyInt(2))),
      );
      const client_memory_budget = multiply(total_ram_in_bytes, client_mem_part);
      const temp_buffers_value = pyMin(
        pyMax(
          default_temp_buffers_in_bytes,
          divide(multiply(client_memory_budget, temp_buffers_part), active_query_sessions),
        ),
        multiply(pyInt(32), mebibyte),
      );

        subtract(client_memory_budget, multiply(temp_buffers_value, active_query_sessions)),
        multiply(
          multiply(multiply(min_work_mem_in_bytes, active_query_sessions), work_mem_concurrency_factor),
          hash_mem_multiplier,
        ),
      );

        work_memory_budget,
        multiply(multiply(active_query_sessions, work_mem_concurrency_factor), hash_mem_multiplier),
      );

    add(multiply(divide(disk_scores, pyInt(100)), subtract(v_max, v_min)), v_min),
  );

  const calc_system_scores_scale = declare(
    'calc_system_scores_scale',
    ['v_min', 'v_max'],
    (v_min, v_max) =>
      add(multiply(divide(system_scores, pyInt(100)), subtract(v_max, v_min)), v_min),
  );

  const calc_synchronous_commit = declare(
    'calc_synchronous_commit',
    ['duty_db', 'synchronous_standby_names'],
    (duty_db, synchronous_standby_names = '') => {
      if (duty_db === enums.DutyDB.FINANCIAL && synchronous_standby_names.trim()) {

  const size_from = declare('size_from', ['sys_bytes', 'system'], (sys_bytes, system = SYS_ISO) =>
    sizeFrom(sys_bytes, system),
  );

  const builtins = {
    int: declare('int', ['x'], toInt),
    float: declare('float', ['x'], toFloat),
    max: declare('max', [], pyMax),
    min: declare('min', [], pyMin),
    round: declare('round', ['number', 'ndigits'], pyRound),
  };

  const roots = {
    ...enums,
    PGConfigurator: Object.freeze({ calc_synchronous_commit }),
    UnitConverter: Object.freeze({
      size_from,
      size_to: declare('size_to', ['bytes', 'system', 'unit'], sizeTo),
      sys_std: SYS_STD,
      sys_iec: SYS_IEC,
      sys_iso: SYS_ISO,
      sys_pg: SYS_PG,
    }),
  };

  const context = {
    calc_client_mem_values,
    calc_connection_limit,
    calc_connection_scale,
    calc_cpu_scale,
    calc_disk_scale,
    calc_system_scores_scale,
    ...builtins,
    ...roots,
  };

  const allowedCallables = [
    calc_synchronous_commit,
    size_from,
    calc_client_mem_values,
    calc_connection_limit,
    calc_connection_scale,
    calc_cpu_scale,
    calc_disk_scale,
    calc_system_scores_scale,
    builtins.float,
    builtins.int,
    builtins.max,
    builtins.min,
    builtins.round,
  ];

  return {
    context,
    allowedCallables,
    allowedAttributeRoots: Object.values(roots),
    helpers: { pyCeil, pyFloor },
  };
}

function pyIntText(value) {
  return String(numberOf(value));
}

 * practical way to review a port of this size, and the differential tests are

 * redesign.

    allocated += value;
  }
  // math.isclose(allocated, limit, rel_tol=0, abs_tol=1e-9) on the Python side.
  if (
    allocated > MEMORY_BUDGET_TOTAL_LIMIT &&
    Math.abs(allocated - MEMORY_BUDGET_TOTAL_LIMIT) > 1e-9
  ) {
    throw new PyValueError(
      `Main memory budgets must use at most ${Math.round(MEMORY_BUDGET_TOTAL_LIMIT * 100)}% ` +
        `of available RAM; got ${pyPercent(allocated)}`,
    );
  }
}

function validatePositiveRange(minValue, maxValue, minName, maxName) {
  for (const [name, value] of [
    [minName, minValue],
    [maxName, maxValue],
  ]) {
    if (typeof value === 'boolean' || !isInteger(value) || value <= 0) {
      throw new PyValueError(`${name} must be a positive integer`);
    }
  }
  if (minValue > maxValue) {
    throw new PyValueError(`${minName} must not be greater than ${maxName}`);
  }
}

// ---------------------------------------------------------------------------
// pg_settings snapshot
// ---------------------------------------------------------------------------

/** Rebuild one version's snapshot from the packed export. */
function loadSettingMetadata(snapshot, version) {
  const columns = snapshot.columns;
  const rows = new Map();
  const toRow = (values) => {
    const row = {};
    columns.forEach((column, index) => {
      row[column] = values[index];
    });
    return row;
  };

  if (version === snapshot.base_version) {
    for (const [name, values] of Object.entries(snapshot.base)) rows.set(name, toRow(values));
    return rows;
  }

  const delta = snapshot.versions[version];
  if (delta === undefined) {
    throw new PyValueError(`Unsupported PostgreSQL version: ${version}`);
  }
  const absent = new Set(delta.absent);
  for (const [name, values] of Object.entries(snapshot.base)) {
    if (!absent.has(name)) rows.set(name, toRow(values));
  }
  for (const [name, values] of Object.entries(delta.changed)) rows.set(name, toRow(values));
  return rows;
}

function parsePgArray(value) {
  const text = (value ?? '').trim();
  if (!text || text === '{}') return new Set();
  const body = text.startsWith('{') && text.endsWith('}') ? text.slice(1, -1) : text;
  return new Set(
    body
      .split(',')
      .map((item) => item.trim().replace(/^"|"$/g, ''))
      .filter((item) => item.length > 0),
  );
}

const SIZE_FACTORS = {
  B: 1,
  kB: 1024,
  '8kB': 8 * 1024,
  MB: 1024 ** 2,
  '16MB': 16 * 1024 ** 2,
  GB: 1024 ** 3,
  TB: 1024 ** 4,
};

// Integer microsecond factors avoid fractional arithmetic for exact conversions.
const TIME_FACTORS = { us: 1, ms: 1000, s: 1_000_000, min: 60_000_000, h: 3_600_000_000, d: 86_400_000_000 };

function numericValueInSettingUnits(amount, sourceUnit, targetUnit) {
  if (!sourceUnit) return amount;
  if (sourceUnit in SIZE_FACTORS && targetUnit in SIZE_FACTORS) {
    return (amount * SIZE_FACTORS[sourceUnit]) / SIZE_FACTORS[targetUnit];
  }
  if (sourceUnit in TIME_FACTORS && targetUnit in TIME_FACTORS) {
    return (amount * TIME_FACTORS[sourceUnit]) / TIME_FACTORS[targetUnit];
  }
  throw new PyValueError(
    `Cannot convert PostgreSQL value from ${sourceUnit} to ${targetUnit || 'unitless'}`,
  );
}

const BOOLEAN_WORDS = new Set(['on', 'off', 'true', 'false', 'yes', 'no', '1', '0']);

function validateSettingValue(settingName, value, metadata, pgVersion) {
  const normalized = String(value).trim().replace(/^'|'$/g, '');
  const vartype = metadata.vartype ?? '';
  if (!vartype) return;

  if (vartype === 'bool') {
    if (!BOOLEAN_WORDS.has(normalized.toLowerCase())) {
      throw new PyValueError(`${settingName} must be a PostgreSQL boolean`);
    }
    return;
  }

  if (vartype === 'enum') {
    const enumValues = parsePgArray(metadata.enumvals);
    if (enumValues.size && !enumValues.has(normalized)) {
      throw new PyValueError(
        `${settingName}=${normalized} is not supported by PostgreSQL ${pgVersion}; ` +
          `expected one of: ${[...enumValues].sort().join(', ')}`,
      );
    }
    return;
  }

  if (vartype === 'integer' || vartype === 'real') {
    const match = /^([+-]?(?:\d+(?:\.\d*)?|\.\d+))([A-Za-z]+|8kB|16MB)?$/.exec(normalized);
    if (match === null) {
      throw new PyValueError(`${settingName}=${normalized} is not a valid PostgreSQL numeric value`);
    }
    const settingValue = numericValueInSettingUnits(
      Number(match[1]),
      match[2] ?? '',
      metadata.unit ?? '',
    );
    const minValue = metadata.min_val ?? '';
    const maxValue = metadata.max_val ?? '';
    let violated = null;
    if (minValue && settingValue < Number(minValue)) violated = ['min_val', minValue];
    else if (maxValue && settingValue > Number(maxValue)) violated = ['max_val', maxValue];
    if (violated !== null) {
      const [boundName, bound] = violated;
      throw new PyValueError(
        `${settingName}=${normalized} violates PostgreSQL ${pgVersion} ` +
          `${boundName}=${bound}${metadata.unit ?? ''}`,
      );
    }
  }
}

const APPLY_MODE_BY_CONTEXT = {
  postmaster: 'restart',
  sighup: 'reload',
  backend: 'reload_and_reconnect',
  'superuser-backend': 'reload_and_reconnect',
  superuser: 'reload',
  user: 'reload',
  internal: 'immutable',
  unknown: 'manual',
};

function applyModeForContext(context) {
  return APPLY_MODE_BY_CONTEXT[context] ?? 'manual';
}

function settingContext(settingName, settingsMetadata, restartRequiredSettings) {
  const context = settingsMetadata.get(settingName)?.context;
  if (context) return [context, 'pg_settings_snapshot'];
  if (settingName.includes('.')) return ['unknown', 'external_extension'];
  const fallback = restartRequiredSettings.has(settingName) ? 'postmaster' : 'sighup';
  return [fallback, 'compatibility_fallback'];
}

// ---------------------------------------------------------------------------
// rule-set preparation
// ---------------------------------------------------------------------------

const sortedVersions = (versioned) =>
  Object.keys(versioned).sort((left, right) => Number(left) - Number(right));

/**
 * Port of `PGConfigurator.prepare_alg_set`.
 *
 * Resolves `__parent` inheritance, deprecation and redefinition. The Python
 * original assigns `prepared_tune_alg[ver]` twice in a row; the first
 * assignment is discarded unread by the second, so only the second is ported.
 * Removing it changes nothing: deprecated names are filtered out of the
 * rebuilt list and again out of the inherited entries.
 */
function prepareAlgSet(tuneAlg, sourceName) {
  if (tuneAlg === null || typeof tuneAlg !== 'object' || Array.isArray(tuneAlg)) {
    throw new PyValueError(`${sourceName} must be a versioned rule mapping`);
  }
  const prepared = {};
  for (const version of sortedVersions(tuneAlg)) {
    const versionAlgSet = tuneAlg[version];
    const deprecated = new Set(
      versionAlgSet.filter((rule) => rule.alg === DEPRECATED).map((rule) => rule.name),
    );

    prepared[version] = versionAlgSet
      .filter((rule) => rule.alg !== DEPRECATED && !('__parent' in rule))
      .map((rule) => ({ ...rule }));

    const currentNames = new Set(prepared[version].map((rule) => rule.name));
    const parentMarker = versionAlgSet.find((rule) => '__parent' in rule);
    const fromParent = parentMarker ? (prepared[parentMarker.__parent] ?? []) : [];

    for (const rule of fromParent) {
      if ('name' in rule && !currentNames.has(rule.name) && !deprecated.has(rule.name)) {
        prepared[version].push({ ...rule });
      }
    }
  }
  return prepared;
}

// ---------------------------------------------------------------------------
// the calculation
// ---------------------------------------------------------------------------

const DEFAULTS = {
  disk_type: 'SSD',
  duty_db: 'mixed',
  replication_enabled: null,
  replication_mode: null,
  pitr_enabled: true,
  synchronous_standby_names: '',
  replica_count: 1,
  logical_subscription_count: 0,
  pg_version: '18',
  reserved_ram_percent: 10,
  reserved_system_ram: '256Mi',
  shared_buffers_part: 0.25,
  client_mem_part: 0.2,
  maintenance_mem_part: 0.1,
  autovacuum_workers_mem_part: 0.5,
  maintenance_conns_mem_part: 0.5,
  min_conns: 20,
  max_conns: 500,
  min_autovac_workers: 3,
  max_autovac_workers: 20,
  min_maint_conns: 4,
  max_maint_conns: 16,
  platform: 'LINUX',
  common_conf: true,
  conf_profiles: null,
  disk_score: null,
  work_mem_concurrency_factor: 4.0,
  peak_wal_rate: null,
  replica_outage_tolerance: 900,
  wal_disk_budget: '32Gi',
  wal_segment_size: '16Mi',
  available_extensions: null,
  db_size: null,
};

/** Every default `make_conf` declares, for the CLI and the form to reuse. */
function makeConfDefaults() {
  return { ...DEFAULTS };
}

function makeConf(cpuCores, ramValue, options, data) {
  const settings = { ...DEFAULTS, ...options };
  const { rules, pgSettings, enums } = data;

  const {
    DiskType,
    DutyDB,
    Platform,
    ReplicationMode,
  } = enums;

  // --- input normalization and validation --------------------------------
  const pg_version = String(settings.pg_version);
  if (!rules.known_versions.includes(pg_version)) {
    throw new PyValueError(`Unsupported PostgreSQL version: ${pg_version}`);
  }

  const disk_type = coerceEnum(settings.disk_type, DiskType, 'disk_type');
  const duty_db = coerceEnum(settings.duty_db, DutyDB, 'duty_db');
  const platform = coerceEnum(settings.platform, Platform, 'platform');

  let replication_enabled = settings.replication_enabled;
  let replication_mode = settings.replication_mode;
  if (replication_enabled !== null && typeof replication_enabled !== 'boolean') {
    throw new PyValueError('replication_enabled must be a boolean or None');
  }
  if (replication_mode === null || replication_mode === undefined) {
    replication_mode =
      replication_enabled === false ? ReplicationMode.NONE : ReplicationMode.PHYSICAL;
  } else {
    replication_mode = coerceEnum(replication_mode, ReplicationMode, 'replication_mode');
  }
  if (
    replication_enabled !== null &&
    replication_enabled !== (replication_mode !== ReplicationMode.NONE)
  ) {
    throw new PyValueError(
      'replication_enabled conflicts with the explicitly selected replication_mode',
    );
  }
  replication_enabled = replication_mode !== ReplicationMode.NONE;

  const pitr_enabled = settings.pitr_enabled;
  const synchronous_standby_names = settings.synchronous_standby_names;
  const common_conf = settings.common_conf;
  if (typeof pitr_enabled !== 'boolean') {
    throw new PyValueError('pitr_enabled must be a boolean');
  }
  if (typeof synchronous_standby_names !== 'string') {
    throw new PyValueError('synchronous_standby_names must be a string');
  }
  if (/[\0\r\n]/.test(synchronous_standby_names)) {
    throw new PyValueError('synchronous_standby_names must not contain NUL or line breaks');
  }
  if (synchronous_standby_names.trim() && !replication_enabled) {
    throw new PyValueError('synchronous_standby_names requires physical or logical replication');
  }
  const [sync_method, sync_required, sync_candidates] =
    parseSynchronousStandbyNames(synchronous_standby_names);
  if (sync_method !== null && pg_version === '9.6') {
    throw new PyValueError(
      `synchronous_standby_names uses ${sync_method}, which PostgreSQL 10 introduced: ` +
        '9.6 accepts a list of names, optionally preceded by a count',
    );
  }
  if (typeof common_conf !== 'boolean') {
    throw new PyValueError('common_conf must be a boolean');
  }
  if (!common_conf) {
    throw new PyValueError(
      'common_conf cannot be disabled: CSV logging, auto_explain, and ' +
        'pg_stat_statements are part of the complete configuration contract',
    );
  }
  const conf_profiles = settings.conf_profiles;
  if (conf_profiles !== null && conf_profiles !== undefined && typeof conf_profiles !== 'string') {
    throw new PyValueError('conf_profiles must be a comma-separated string');
  }
  const available_extensions = settings.available_extensions;
  if (
    available_extensions !== null &&
    available_extensions !== undefined &&
    typeof available_extensions !== 'string' &&
    !Array.isArray(available_extensions)
  ) {
    throw new PyValueError(
      'available_extensions must be a comma-separated string or collection',
    );
  }

  let selected_profiles = [];
  if (conf_profiles) {
    selected_profiles = conf_profiles.split(',').map((item) => item.trim());
    if (selected_profiles.some((profile) => profile === '')) {
      throw new PyValueError('Profile name must not be empty');
    }
    if (new Set(selected_profiles).size !== selected_profiles.length) {
      throw new PyValueError('Profile names must not be repeated');
    }
    const unknown = selected_profiles.filter((profile) => !(profile in rules.profiles));
    if (unknown.length) {
      throw new PyValueError(`Unknown configuration profiles: ${unknown.join(', ')}`);
    }
    const unsupported = selected_profiles.filter(
      (profile) => !rules.profiles[profile].supported_versions.includes(pg_version),
    );
    if (unsupported.length) {
      throw new PyValueError(
        `Profiles do not support PostgreSQL ${pg_version}: ${unsupported.join(', ')}`,
      );
    }
    if (selected_profiles.includes('profile_1c') && selected_profiles.length !== 1) {
      throw new PyValueError(
        'profile_1c is an exclusive compatibility profile and cannot be combined ' +
          'with other configuration profiles',
      );
    }
  }

  const disk_score = settings.disk_score;
  if (disk_score !== null && disk_score !== undefined) {
    if (typeof disk_score === 'boolean' || !isNumber(disk_score)) {
      throw new PyValueError('disk_score must be a number');
    }
    if (disk_score < 0 || disk_score > 100) {
      throw new PyValueError('disk_score must be between 0 and 100');
    }
  }
  const work_mem_concurrency_factor = settings.work_mem_concurrency_factor;
  if (
    typeof work_mem_concurrency_factor === 'boolean' ||
    !isNumber(work_mem_concurrency_factor) ||
    work_mem_concurrency_factor < 1
  ) {
    throw new PyValueError('work_mem_concurrency_factor must be a number not less than 1');
  }

  const reserved_ram_percent = settings.reserved_ram_percent;
  if (typeof reserved_ram_percent === 'boolean' || !isNumber(reserved_ram_percent)) {
    throw new PyValueError('reserved_ram_percent must be a number');
  }
  if (reserved_ram_percent < 0 || reserved_ram_percent >= 100) {
    throw new PyValueError(
      'reserved_ram_percent must be greater than or equal to 0 and less than 100',
    );
  }

  const shared_buffers_part = settings.shared_buffers_part;
  const client_mem_part = settings.client_mem_part;
  const maintenance_mem_part = settings.maintenance_mem_part;
  validateMemoryBudgetParts({ shared_buffers_part, client_mem_part, maintenance_mem_part });

  const autovacuum_workers_mem_part = settings.autovacuum_workers_mem_part;
  const maintenance_conns_mem_part = settings.maintenance_conns_mem_part;
  validateFractionGroup(
    { autovacuum_workers_mem_part, maintenance_conns_mem_part },
    'Maintenance memory parts',
  );

  const { min_conns, max_conns, min_autovac_workers, max_autovac_workers } = settings;
  const { min_maint_conns, max_maint_conns } = settings;
  validatePositiveRange(min_conns, max_conns, 'min_conns', 'max_conns');
  validatePositiveRange(
    min_autovac_workers,
    max_autovac_workers,
    'min_autovac_workers',
    'max_autovac_workers',
  );
  if (selected_profiles.includes('profile_1c') && max_autovac_workers < 4) {
    throw new PyValueError('profile_1c requires max_autovac_workers to be at least 4');
  }
  validatePositiveRange(min_maint_conns, max_maint_conns, 'min_maint_conns', 'max_maint_conns');

  const replica_count = settings.replica_count;
  const logical_subscription_count = settings.logical_subscription_count;
  for (const [name, value] of [
    ['replica_count', replica_count],
    ['logical_subscription_count', logical_subscription_count],
  ]) {
    if (typeof value === 'boolean' || !isInteger(value) || value < 0) {
      throw new PyValueError(`${name} must be a non-negative integer`);
    }
  }
  if (pg_version === '9.6' && logical_subscription_count) {
    throw new PyValueError('logical_subscription_count requires PostgreSQL 10 or newer');
  }
  if (logical_subscription_count && replication_mode !== ReplicationMode.LOGICAL) {
    throw new PyValueError('logical_subscription_count requires replication_mode=logical');
  }
  const replica_outage_tolerance = settings.replica_outage_tolerance;
  if (
    typeof replica_outage_tolerance === 'boolean' ||
    !isInteger(replica_outage_tolerance) ||
    replica_outage_tolerance < 0
  ) {
    throw new PyValueError('replica_outage_tolerance must be a non-negative integer');
  }

  const page_size = PAGE_SIZE;
  const mebibyte = MEBIBYTE;
  const gibibyte = GIBIBYTE;
  const min_work_mem_in_bytes = MIN_WORK_MEM_IN_BYTES;
  const default_temp_buffers_in_bytes = DEFAULT_TEMP_BUFFERS_IN_BYTES;
  const backend_memory_reserve_in_bytes = BACKEND_MEMORY_RESERVE_IN_BYTES;

  const total_cpu_cores = numberOf(
    (() => {
      const parsed = /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))\s*(m?)\s*$/i.exec(String(cpuCores));
      if (typeof cpuCores === 'boolean') {
        throw new PyValueError('Boolean values are not valid CPU values');
      }
      if (parsed === null) {
        throw new PyValueError(`Invalid CPU value: ${cpuCores}`);
      }
      let amount = Number(parsed[1]);
      if (parsed[2].toLowerCase() === 'm') amount /= 1000;
      return pyRound(pyFloat(amount), 3);
    })(),
  );
  if (total_cpu_cores <= 0) {
    throw new PyValueError('cpu_cores must be greater than 0');
  }
  const cpu_threads = Math.max(1, Math.floor(total_cpu_cores));

  const ram_in_bytes = numberOf(sizeFrom(ramValue, SYS_IEC));
  const reserved_system_ram_in_bytes = numberOf(sizeFrom(settings.reserved_system_ram, SYS_IEC));
  if (ram_in_bytes <= 0) {
    throw new PyValueError('ram_value must be greater than 0');
  }
  if (reserved_system_ram_in_bytes < 0) {
    throw new PyValueError('reserved_system_ram must not be negative');
  }

  const available_ram_ratio = (100 - reserved_ram_percent) / 100;
  const total_ram_in_bytes = ram_in_bytes * available_ram_ratio - reserved_system_ram_in_bytes;
  if (total_ram_in_bytes <= 0) {
    throw new PyValueError(
      'Available RAM must be greater than 0 after reserved memory is subtracted',
    );
  }

  const db_size = settings.db_size;
  if (db_size !== null && db_size !== undefined && (typeof db_size !== 'string' || !db_size.trim())) {
    throw new PyValueError('db_size must be a non-empty IEC size string or None');
  }
  const database_size_in_bytes =
    db_size !== null && db_size !== undefined ? numberOf(sizeFrom(db_size, SYS_IEC)) : null;
  if (database_size_in_bytes !== null && database_size_in_bytes <= 0) {
    throw new PyValueError('db_size must be greater than 0');
  }

  const peak_wal_rate_source =
    settings.peak_wal_rate !== null && settings.peak_wal_rate !== undefined
      ? 'explicit'
      : 'default';
  const peak_wal_rate =
    peak_wal_rate_source === 'explicit' ? settings.peak_wal_rate : ASSUMED_PEAK_WAL_RATE;
  const peak_wal_rate_in_bytes = numberOf(sizeFrom(peak_wal_rate, SYS_IEC));
  const wal_disk_budget_in_bytes = numberOf(sizeFrom(settings.wal_disk_budget, SYS_IEC));
  const wal_segment_size_in_bytes = numberOf(sizeFrom(settings.wal_segment_size, SYS_IEC));
  if (peak_wal_rate_in_bytes <= 0) {
    throw new PyValueError('peak_wal_rate must be greater than 0');
  }
  if (wal_disk_budget_in_bytes < gibibyte) {
    throw new PyValueError('wal_disk_budget must be at least 1Gi');
  }
  if (
    wal_segment_size_in_bytes < mebibyte ||
    wal_segment_size_in_bytes > gibibyte ||
    (wal_segment_size_in_bytes & (wal_segment_size_in_bytes - 1)) !== 0
  ) {
    throw new PyValueError('wal_segment_size must be a power-of-two size between 1Mi and 1Gi');
  }
  if (wal_disk_budget_in_bytes < wal_segment_size_in_bytes * 8) {
    throw new PyValueError('wal_disk_budget must hold at least eight WAL segments');
  }

  const memory_allocated_part = shared_buffers_part + client_mem_part + maintenance_mem_part;
  const operating_headroom_part = 1.0 - memory_allocated_part;
  const connection_overhead_budget = total_ram_in_bytes * operating_headroom_part * 0.67;
  const connection_capacity = Math.trunc(
    connection_overhead_budget / backend_memory_reserve_in_bytes,
  );
  if (connection_capacity < min_conns) {
    throw new PyValueError(
      `Backend memory reserve supports ${connection_capacity} connections, ` +
        `less than min_conns=${min_conns}: add RAM, lower min_conns, or shrink the ` +
        'memory parts so that more headroom is left for backends',
    );
  }

  const connections_per_cpu = duty_db === DutyDB.OLTP ? 5 : 4;
  const duty_work_mem_cap_bytes = byDuty(duty_db, DutyDB, {
    FINANCIAL: 16 * mebibyte,
    OLTP: 32 * mebibyte,
    MIXED: 64 * mebibyte,
    STATISTIC: 256 * mebibyte,
  });
  const autovacuum_cpu_divisor = duty_db === DutyDB.OLTP ? 6 : 8;
  const autovacuum_naptime = byDuty(duty_db, DutyDB, {
    FINANCIAL: '30s',
    OLTP: '20s',
    MIXED: '30s',
    STATISTIC: '30s',
  });
  const autovacuum_vacuum_scale_factor = byDuty(duty_db, DutyDB, {
    FINANCIAL: 0.02,
    OLTP: 0.015,
    MIXED: 0.02,
