queries:
  cluster.server_version:
    title: PostgreSQL Full Version
    group: Overview
    main_view: pg_catalog
    description: Full PostgreSQL server version string.
    result_shape: scalar_text
    display:
      default_sort:
        column: version
        direction: asc
    collection:
      default: once
      supports: [once]
    variants:
      - id: cluster_server_version_all
        min_pg_version: 90400
        sql_file: cluster/server_version.sql

  cluster.settings:
    title: PostgreSQL Settings
    group: Overview
    main_view: pg_settings
    description: Runtime settings with display-friendly values where possible.
    source: postgresai
    display:
      default_sort:
        column: setting_name
        direction: asc
    evaluation:
      summary_title: PostgreSQL settings require review
      recommendation: Review pending-restart settings and validate work_mem against concurrency and query spill evidence before changing it globally.
    collection:
      default: once
      supports: [once]
    variants:
      - id: cluster_settings_all
        min_pg_version: 90400
        sql_file: cluster/settings.sql

  cluster.version_eol_status:
    title: Version End-Of-Life Status
    group: Overview
    main_view: pg_settings
    description: The server major version compared with the community end-of-life schedule.
    source: pg_diag
    display:
      default_sort:
        column: risk_level
        direction: desc
    evaluation:
      summary_title: PostgreSQL version support status requires review
      recommendation: Plan and execute a major upgrade before the running version stops receiving security and bug fixes.
    collection:
      default: once
      supports: [once]
    variants:
      - id: cluster_version_eol_status_pg10_plus
        min_pg_version: 100000
        sql_file: cluster/version_eol_status.sql

  cluster.durability_safety_settings:
    title: Durability Safety Settings
    group: Overview
    main_view: pg_settings
    description: fsync, full_page_writes, and the cluster-wide synchronous_commit default with their durability risk.
    source: pg_diag
    display:
      default_sort:
        column: risk_level
        direction: desc
    evaluation:
      summary_title: Durability settings require review
      recommendation: Re-enable fsync and full_page_writes unless the storage stack provably guarantees durability, and confirm that a non-default synchronous_commit is an accepted policy.
    collection:
      default: once
      supports: [once]
    variants:
      - id: cluster_durability_safety_settings_pg10_plus
        min_pg_version: 100000
        sql_file: cluster/durability_safety_settings.sql

  cluster.corruption_suppression_settings:
    title: Corruption Suppression Settings
    group: Overview
    main_view: pg_settings
    description: Settings that hide or amplify data corruption when enabled - ignore_checksum_failure, zero_damaged_pages, and ignore_invalid_pages.
    source: pg_diag
    display:
      default_sort:
        column: risk_level
        direction: desc
    evaluation:
      summary_title: Corruption suppression settings require review
      recommendation: Keep these settings off outside a supervised data-rescue session and investigate why any of them is enabled.
    collection:
      default: once
      supports: [once]
    variants:
      - id: cluster_corruption_suppression_settings_pg10_plus
        min_pg_version: 100000
        sql_file: cluster/corruption_suppression_settings.sql

  cluster.stat_reset_times:
    title: Statistics Reset Times
    group: Overview
    main_view: pg_stat_database
    description: Statistics reset timestamps and elapsed time since reset for PostgreSQL statistics views that expose stats_reset.
    source: PostgreSQL docs
    display:
      default_sort:
        column: seconds_since_reset
        direction: asc
    collection:
      default: once
      supports: [once, every_snapshot]
    variants:
      - id: cluster_stat_reset_times_pg10_pg12
        min_pg_version: 100000
        max_pg_version: 129999
        sql_file: cluster/stat_reset_times_pg10_pg12.sql
      - id: cluster_stat_reset_times_pg13
        min_pg_version: 130000
        max_pg_version: 139999
        sql_file: cluster/stat_reset_times_pg13.sql
      - id: cluster_stat_reset_times_pg14
        min_pg_version: 140000
        max_pg_version: 149999
        sql_file: cluster/stat_reset_times_pg14.sql
      - id: cluster_stat_reset_times_pg15
        min_pg_version: 150000
        max_pg_version: 159999
        sql_file: cluster/stat_reset_times_pg15.sql
      - id: cluster_stat_reset_times_pg16
        min_pg_version: 160000
        max_pg_version: 169999
        sql_file: cluster/stat_reset_times_pg16.sql
      - id: cluster_stat_reset_times_pg17_plus
        min_pg_version: 170000
        sql_file: cluster/stat_reset_times_pg17_plus.sql
