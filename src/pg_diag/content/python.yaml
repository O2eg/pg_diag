python_catalog:
  schema_version: 4
  defaults:
    timeout_ms: 1000
    local_only: false

python_sources:
  os.postgresql_huge_pages:
    targets: [host, db]
    title: PostgreSQL Huge Pages
    description: Correlate PostgreSQL huge-page settings and actual use with the matching OS pool, host page-table memory, and connected-instance process evidence.
    python_file: os/postgresql_huge_pages.py
    function: collect
    timeout_ms: 3000
    local_only: true

  backend.postgres_main_process_linked_libraries:
    targets: [host, db]
    title: PostgreSQL Main Process ldd Dependencies
    description: Resolve the PostgreSQL main process that owns the current database backend and capture the dynamic dependencies reported by ldd for that exact executable.
    python_file: backend/postgres_main_process_linked_libraries.py
    function: collect
    timeout_ms: 3000
    local_only: true
    display:
      default_sort:
        column: library
        direction: asc

  cluster.pg_controldata:
    targets: [host, db]
    title: PostgreSQL Control Data
    description: Read cluster control and initdb-format information with the pg_controldata binary belonging to the running PostgreSQL server.
    python_file: cluster/pg_controldata.py
    function: collect
    timeout_ms: 1000
    local_only: true
    display:
      default_sort:
        column: parameter
        direction: asc

  database.database_volume:
    targets: [db]
    title: Database Volume
    description: Collect database sizes and user-object counts by connecting sequentially to every database.
    python_file: database/database_volume.py
    function: collect
    timeout_ms: 300000
    display:
      default_sort:
        column: database_size_bytes
        direction: desc
  security.remote_superuser_access:
    targets: [host, db]
    title: Remote Superuser Access
    description: Detect and classify pg_hba.conf host rules that allow login superusers over loopback or non-loopback TCP.
    python_file: security/remote_superuser_access.py
    function: collect
    timeout_ms: 5000
    local_only: true
  security.pg_hba_insecure_auth_methods:
    targets: [host, db]
    title: pg_hba Insecure Auth Methods
    description: Detect pg_hba.conf rules that use trust, password, ident, or md5 authentication.
    python_file: security/pg_hba_insecure_auth_methods.py
    function: collect
    local_only: true
  security.pg_hba_broad_network_ranges:
    targets: [host, db]
    title: pg_hba Broad Network Ranges
    description: Detect pg_hba.conf host rules that allow universal or overly broad client address ranges.
    python_file: security/pg_hba_broad_network_ranges.py
    function: collect
    local_only: true
  security.pg_hba_generic_database_or_user:
    targets: [host, db]
    title: pg_hba Generic Database Or User
    description: Detect pg_hba.conf rules that use all for database or user matching.
    python_file: security/pg_hba_generic_database_or_user.py
    function: collect
    local_only: true
  security.pg_hba_tls_enforcement:
    targets: [host, db]
    title: pg_hba TLS Enforcement
    description: Detect non-loopback pg_hba.conf rules that allow unencrypted TCP connections.
    python_file: security/pg_hba_tls_enforcement.py
    function: collect
    local_only: true
  security.pg_hba_file_permissions:
    targets: [host, db]
    title: pg_hba File Permissions
    description: Detect pg_hba.conf file permissions broader than 0600 or 0640.
    python_file: security/pg_hba_file_permissions.py
    function: collect
    local_only: true
  security.unix_socket_permissions:
    targets: [host, db]
    title: Unix Socket Permissions
    description: Detect PostgreSQL Unix socket permissions that allow access by other OS users.
    python_file: security/unix_socket_permissions.py
    function: collect
    timeout_ms: 3000
    local_only: true
  security.pgdata_permissions:
    targets: [host, db]
    title: PGDATA Permissions
    description: Detect PostgreSQL data directory permissions broader than expected.
    python_file: security/pgdata_permissions.py
    function: collect
    local_only: true
  security.postgres_client_secret_files:
    targets: [host]
    title: PostgreSQL Client Secret Files
    description: Detect local PostgreSQL client password and service files with secret or permission findings.
    python_file: security/postgres_client_secret_files.py
    function: collect
    timeout_ms: 10000
    local_only: true
  security.postgres_config_file_permissions:
    targets: [host, db]
    title: PostgreSQL Config File Permissions
    description: Detect PostgreSQL configuration files with permissions broader than 0600 or 0640.
    python_file: security/postgres_config_file_permissions.py
    function: collect
    timeout_ms: 5000
    local_only: true
  security.tls_key_file_permissions:
    targets: [host, db]
    title: TLS Key File Permissions
    description: Detect PostgreSQL TLS private key and support files with unsafe local permissions.
    python_file: security/tls_key_file_permissions.py
    function: collect
    local_only: true
  security.log_file_permissions:
    targets: [host, db]
    title: Log File Permissions
    description: Detect PostgreSQL log directories or files readable or writable by untrusted OS users.
    python_file: security/log_file_permissions.py
    function: collect
    timeout_ms: 30000
    local_only: true
  security.postgres_binary_integrity:
    targets: [host]
    title: PostgreSQL Binary Permissions
    description: Detect discovered PostgreSQL executable paths with unsafe ownership or write permissions; this is not a package-integrity or checksum check.
    python_file: security/postgres_binary_integrity.py
    function: collect
    timeout_ms: 30000
    local_only: true
  security.extension_directory_permissions:
    targets: [host]
    title: Extension Directory Permissions
    description: Detect PostgreSQL extension directories writable by group or other OS users.
    python_file: security/extension_directory_permissions.py
    function: collect
    timeout_ms: 10000
    local_only: true
  security.tablespace_directory_permissions:
    targets: [host, db]
    title: Tablespace Directory Permissions
    description: Detect tablespace directories with permissions broader than expected.
    python_file: security/tablespace_directory_permissions.py
    function: collect
    local_only: true
  security.wal_archive_directory_permissions:
    targets: [host, db]
    title: WAL Archive Directory Permissions
    description: Detect WAL archive paths with permissions broader than expected.
    python_file: security/wal_archive_directory_permissions.py
    function: collect
    timeout_ms: 5000
    local_only: true
  security.backup_repository_permissions:
    targets: [host]
    title: Backup Repository Permissions
    description: Detect common PostgreSQL backup repository paths with unsafe permissions.
    python_file: security/backup_repository_permissions.py
    function: collect
    timeout_ms: 10000
    local_only: true
  security.postgres_os_group_members:
    targets: [host]
    title: PostgreSQL OS Group Members
    description: Detect non-service OS users in the postgres group.
    python_file: security/postgres_os_group_members.py
    function: collect
    local_only: true
  security.sudoers_postgres_escalation:
    targets: [host]
    title: sudoers PostgreSQL Escalation
    description: Detect sudoers rules that may allow broad escalation to or from the postgres OS account.
    python_file: security/sudoers_postgres_escalation.py
    function: collect
    local_only: true
  security.postgres_service_hardening:
    targets: [host, db]
    title: PostgreSQL Service Hardening
    description: Detect missing systemd hardening directives for PostgreSQL units.
    python_file: security/postgres_service_hardening.py
    function: collect
    local_only: true
  security.postgres_env_secret_leaks:
    targets: [host]
    title: PostgreSQL Environment Secret Leaks
    description: Detect PostgreSQL credentials in readable process environments.
    python_file: security/postgres_env_secret_leaks.py
    function: collect
    local_only: true
  security.postgres_history_files:
    targets: [host]
    title: PostgreSQL History Files
    description: Detect PostgreSQL history files with broad permissions or sensitive command entries.
    python_file: security/postgres_history_files.py
    function: collect
    timeout_ms: 10000
    local_only: true
  security.world_writable_paths_in_pg_tree:
    targets: [host, db]
    title: World-Writable Paths In PostgreSQL Trees
    description: Detect world-writable files or directories in PostgreSQL-sensitive paths.
    python_file: security/world_writable_paths_in_pg_tree.py
    function: collect
    timeout_ms: 30000
    local_only: true
  security.symlinks_in_sensitive_paths:
    targets: [host, db]
    title: Symlinks In Sensitive Paths
    description: Detect symlinks under PostgreSQL-sensitive paths for manual verification.
    python_file: security/symlinks_in_sensitive_paths.py
    function: collect
    timeout_ms: 30000
    local_only: true
  security.firewall_postgres_exposure:
    targets: [host, db]
    title: Firewall PostgreSQL Exposure
    description: Detect broad local firewall exposure for a PostgreSQL port listening beyond loopback.
    python_file: security/firewall_postgres_exposure.py
    function: collect
    timeout_ms: 5000
    local_only: true
  security.procfs_hardening:
    targets: [host]
    title: procfs Hardening
    description: Detect procfs and ptrace settings that expose process metadata too broadly.
    python_file: security/procfs_hardening.py
    function: collect
    local_only: true
  security.core_dump_policy:
    targets: [host]
    title: Core Dump Policy
    description: Detect core dump settings that may expose PostgreSQL process memory.
    python_file: security/core_dump_policy.py
    function: collect
    local_only: true
  security.disk_encryption_status:
    targets: [host, db]
    title: Disk Encryption Evidence
    description: Report PostgreSQL-sensitive mounts whose encryption cannot be confirmed from filesystem type and lsblk TYPE=crypt ancestry.
    python_file: security/disk_encryption_status.py
    function: collect
    timeout_ms: 5000
    local_only: true
  security.postgres_cron_timer_scripts:
    targets: [host]
    title: PostgreSQL Cron And Timer Scripts
    description: Detect writable PostgreSQL cron, timer, or maintenance script paths.
    python_file: security/postgres_cron_timer_scripts.py
    function: collect
    timeout_ms: 30000
    local_only: true
  security.role_password_hashes:
    targets: [db]
    title: Role Password Hashes
    description: Detect visible login role password hashes weaker than SCRAM-SHA-256.
    python_file: security/role_password_hashes.py
    function: collect
    local_only: false
    timeout_ms: 5000
  roles.hba_rules:
    targets: [db]
    title: pg_hba Rules As Seen By The Server
    description: Client authentication rules from pg_hba_file_rules, including lines the server could not parse, without reading files on the host.
    python_file: roles/hba_rules.py
    function: collect
    timeout_ms: 5000
    display:
      default_sort:
        column: evaluation_order
        direction: asc
  roles.ident_mappings:
    targets: [db]
    title: pg_ident User Name Maps
    description: User name maps from pg_ident_file_mappings on PostgreSQL 15 and newer, including lines the server could not parse.
    python_file: roles/ident_mappings.py
    function: collect
    timeout_ms: 5000
    display:
      default_sort:
        column: evaluation_order
        direction: asc
  roles.subscription_ownership:
    targets: [db]
    title: Subscription Ownership
    description: Logical replication subscriptions in every database with owner attributes, enabled state, slot name, and publications; the connection string is never read.
    python_file: roles/subscription_ownership.py
    function: collect
    timeout_ms: 5000
    display:
      default_sort:
        column: database_name
        direction: asc
  server_log.error_chronology:
    targets: [db]
    title: Error Chronology From Server Log
    description: The newest 100 series of ERROR, FATAL, and PANIC records from csvlog with adjacent identical errors collapsed into one series, so floods of one repeated error do not push unique errors out of the list.
    python_file: server_log/error_chronology.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: first_time
        direction: desc
  server_log.top_errors:
    targets: [db]
    title: Top Errors By Frequency
    description: The 100 most frequent error fingerprints in the collected log window with occurrence counts, first and last time seen, and how many users and databases were affected.
    python_file: server_log/top_errors.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: occurrences
        direction: desc
  server_log.top_warnings:
    targets: [db]
    title: Top Warnings By Frequency
    description: The 100 most frequent WARNING fingerprints in the collected log window with occurrence counts and first and last time seen.
    python_file: server_log/top_warnings.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: occurrences
        direction: desc
  server_log.crash_recovery_events:
    targets: [db]
    title: Crash And Recovery Events
    description: Backend and postmaster crashes, crash recovery markers, and invalid-page corruption evidence from the server log; any row is an incident-grade finding.
    python_file: server_log/crash_recovery_events.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: log_time
        direction: desc
  server_log.deadlock_events:
    targets: [db]
    title: Deadlock Events
    description: Deadlocks (SQLSTATE 40P01) recorded in the collected log window with the sanitized message naming the sessions involved.
    python_file: server_log/deadlock_events.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: log_time
        direction: desc
  server_log.authentication_failures:
    targets: [db]
    title: Authentication Failures
    description: Failed login attempts grouped by user, client address, and database with counts and first and last time seen.
    python_file: server_log/authentication_failures.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: failures
        direction: desc
  server_log.autovacuum_runs:
    targets: [db]
    title: Autovacuum Runs From Server Log
    description: Chronology of automatic vacuum and analyze runs recorded in csvlog with the relation, optional elapsed seconds, and the first line of the report; visible only when log_autovacuum_min_duration is not -1.
    python_file: server_log/autovacuum_runs.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: log_time
        direction: desc
  server_log.checkpoints:
    targets: [db]
    title: Checkpoints From Server Log
    description: Checkpoint and restartpoint starting and complete events with the trigger reason, buffers written, and write/sync/total timings; requires log_checkpoints.
    python_file: server_log/checkpoints.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: log_time
        direction: desc
  server_log.archiver_failures:
    targets: [db]
    title: WAL Archiver Failures
    description: Failed archive_command invocations from the server log; any row means un-archived WAL is accumulating and the WAL archive has a gap.
    python_file: server_log/archiver_failures.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: first_time
        direction: desc
  server_log.wraparound_pressure:
    targets: [db]
    title: Transaction ID Wraparound Pressure
    description: Wraparound protection warnings and stop-stage errors from the server log, surfaced as an incident-grade finding instead of drowning among ordinary warnings.
    python_file: server_log/wraparound_pressure.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: first_time
        direction: desc
  server_log.log_files_overview:
    targets: [db]
    title: Server Log Files Overview
    description: Inventory of csvlog files from pg_ls_logdir with sizes, rotation settings, and findings about disabled rotation or runaway log growth; works without read access to the log content.
    python_file: server_log/log_files_overview.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: modification
        direction: desc
  server_log.system_incidents:
    targets: [db]
    title: System Incidents From Server Log
    description: Disk-full, memory, connection/configuration limit, read/write/fsync, checksum, and data/index/WAL corruption evidence, bounded to the 100 highest-priority series.
    python_file: server_log/system_incidents.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: last_time
        direction: desc
  server_log.server_lifecycle:
    targets: [db]
    title: Server Lifecycle From Server Log
    description: PostgreSQL startup, shutdown, backend crash, crash recovery, promotion, readiness, configuration reload, and startup-failure markers, bounded to 100 rows.
    python_file: server_log/server_lifecycle.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: first_time
        direction: desc
  server_log.replication_events:
    targets: [db]
    title: Replication And WAL Transport Events
    description: Archive/restore failures, WAL sender/receiver disconnects, missing WAL, timeline mismatch, slot invalidation, logical replication errors, and recovery conflicts, bounded to 100 rows.
    python_file: server_log/replication_events.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: occurrences
        direction: desc
  server_log.query_termination_events:
    targets: [db]
    title: Query Termination Events By Minute
    description: Minute chart for statement/lock timeouts, user cancellation, recovery conflict, administrative shutdown, and NOWAIT failures with deduplicated message and SQL references.
    python_file: server_log/query_termination_events.py
    function: collect
    timeout_ms: 3000
  server_log.query_resource_events:
    targets: [db]
    title: Query Time And Temporary File Events
    description: Slow statements and temporary-file records grouped by query, database, and application and ranked by duration and temporary bytes, bounded to 100 groups.
    python_file: server_log/query_resource_events.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: total_temp_bytes
        direction: desc
  server_log.maintenance_events:
    targets: [db]
    title: Heavy And Failed Maintenance Events
    description: Heavy autovacuum/autoanalyze and failed, cancelled, blocked, or wraparound-related VACUUM, ANALYZE, and REINDEX events using documented impact thresholds and a 100-row limit.
    python_file: server_log/maintenance_events.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: impact_score
        direction: desc
  server_log.lock_waits:
    targets: [db]
    title: Lock Waits From Server Log
    description: History of lock waits longer than deadlock_timeout from the server log, including resolved waits with their final duration, the holding process, and the wait queue depth; requires log_lock_waits.
    python_file: server_log/lock_waits.py
    function: collect
    timeout_ms: 3000
    display:
      default_sort:
        column: wait_ms
        direction: desc
  server_log.auto_explain_plans:
    targets: [db]
    title: Top Auto Explain Queries By Minute
    description: One clock-aligned column per minute with up to ten longest queries logged by auto_explain; every stacked block is one query, exposes a sanitized 300-character query sample, and opens a bounded sanitized plan in the bundled read-only viewer.
    python_file: server_log/auto_explain_plans.py
    function: collect
    timeout_ms: 3000
